name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: python3 tests/native-settings.test.py
      - run: python3 tests/native-resources.test.py
      - run: python3 -m unittest discover -s tests -p 'test_release.py'
      - run: python3 script/prepare_release.py && git diff --exit-code
      - run: python3 script/package_app.py
